receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
processors:
  batch:
    timeout: 200ms
exporters:
  otlp_http/watcher:
    endpoint: ${env:MELAMPUS_WATCH_ENDPOINT}
    sending_queue:
      enabled: false
    retry_on_failure:
      enabled: true
      initial_interval: 100ms
      max_interval: 500ms
      max_elapsed_time: 3s
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/watcher, debug]
